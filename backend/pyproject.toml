[project]
name = "video-downloader-backend"
version = "0.1.0"
description = "Local FastAPI service for a yt-dlp video library"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.10,<8",
  "hypothesis>=6.135,<7",
]

[tool.uv]
package = false
